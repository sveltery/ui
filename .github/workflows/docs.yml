name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      # Booleans only. The secrets themselves reach the deploy step alone.
      CAN_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.DOCS_SITE_URL != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - name: Build the site and its search index
        run: bash -c 'source scripts/toolchain.sh; pnpm --filter @sveltery/ui build && pnpm --filter @sveltery/docs build'
      - name: Deploy to Cloudflare
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash -c 'source scripts/toolchain.sh; pnpm --filter @sveltery/docs run deploy'
      - name: Skip the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CAN_DEPLOY != 'true'
        run: echo "::notice::To deploy the docs, set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the DOCS_SITE_URL variable."

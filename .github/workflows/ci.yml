name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every push to main runs to the end, so each merge gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [static, unit, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      # static: lint and types. unit: vitest. build: docs build, remote forms and package smoke test.
      - run: bash scripts/verify.sh ${{ matrix.part }}
  # One stable check name for the split verification.
  verify-result:
    name: Verify
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.verify.result }}" = success
  browser:
    name: Chromium (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - name: Build packages
        run: bash scripts/build-packages.sh
      # The runner image already ships the system libraries Chromium needs.
      - name: Install Chromium
        run: bash -c 'source scripts/toolchain.sh; pnpm exec playwright install chromium'
      # Shards split the specs by recorded run time. Two workers per runner: more saturates the four vCPUs and timing-sensitive tests fail.
      - name: Browser tests
        run: bash -c 'source scripts/toolchain.sh; node scripts/browser-shard.mjs ${{ matrix.shard }} 4 > "$RUNNER_TEMP/specs.txt"; pnpm test:browser --project chromium --test-list "$RUNNER_TEMP/specs.txt" --workers 2'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: chromium-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  # One stable check name for the sharded browser suite.
  browser-result:
    name: Chromium
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.browser.result }}" = success
  cli-e2e:
    name: CLI end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - run: bash -c 'source scripts/toolchain.sh; pnpm exec playwright install --with-deps chromium && pnpm --filter ./packages/cli test:e2e'

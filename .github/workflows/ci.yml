name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - name: Lint, types, unit tests, docs build, remote forms and package smoke test
        run: bash scripts/verify.sh
  browser:
    name: Chromium (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - run: bash -c 'source scripts/toolchain.sh; pnpm --filter @sveltery/resizable --filter @sveltery/svelte --filter @sveltery/command build && pnpm exec playwright install --with-deps chromium && pnpm test:browser --project chromium --shard ${{ matrix.shard }}/4 --workers 2'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: chromium-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  # One stable check name for the sharded browser suite.
  browser-result:
    name: Chromium
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.browser.result }}" = success
  cli-e2e:
    name: CLI end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - run: bash -c 'source scripts/toolchain.sh; pnpm exec playwright install --with-deps chromium && pnpm --filter ./packages/cli test:e2e'

name: Release

# Pushing a v* tag publishes every non-private package in packages/ to npm through trusted
# publishing (OIDC), so the job needs no NPM_TOKEN. Each package's first version must be
# published by hand before npm accepts this workflow as its trusted publisher.
# Bump all packages together with `node scripts/set-version.mjs <x.y.z>` before tagging.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh

      - name: Check the tag matches every package version
        run: node scripts/set-version.mjs --check "$GITHUB_REF_NAME"

      - run: bash scripts/verify.sh

      - name: Publish
        # Versions already on npm are skipped, so a re-run after a partial failure is safe.
        # Trusted publishing needs npm 11.5.1+.
        run: |
          source scripts/toolchain.sh
          npm install --global npm@11.6.2
          if [[ "$(ls packages | xargs)" != "cli command day-picker input-otp message-scroller questionnaire resizable" ]]; then
            echo "::error::packages/ changed. Add the new package to the publish order below."
            exit 1
          fi
          for dir in cli command day-picker input-otp message-scroller questionnaire resizable; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if [[ "$(node -p "require('./packages/$dir/package.json').private === true")" == true ]]; then
              echo "::notice::$name is private, not published."
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm."
              continue
            fi
            pack="$RUNNER_TEMP/pack/$dir"
            mkdir -p "$pack"
            pnpm --filter "$name" pack --pack-destination "$pack"
            npm publish "$pack"/*.tgz --access public --provenance
          done

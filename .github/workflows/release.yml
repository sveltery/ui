name: Release

# Pushing a v* tag publishes to npm, through trusted publishing (OIDC) so the job needs no
# NPM_TOKEN, each public package in packages/ whose version is not on npm yet. Every such package
# must be at the tag's version; scripts/release-plan.mjs checks this before anything is published.
# Each package's first version must be published by hand before npm accepts this workflow as its
# trusted publisher. The packages ask for provenance, which only CI can generate, so that local
# publish needs --provenance=false:
#   npm publish <tarball> --access public --provenance=false
# Bump the packages to release, or all of them with `node scripts/set-version.mjs <x.y.z>`, before tagging.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh

      - name: Pick the packages to publish
        run: node scripts/release-plan.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/publish.txt"

      - run: bash scripts/verify.sh

      - name: Publish
        # The plan skips versions already on npm, so a re-run after a partial failure is safe.
        # Trusted publishing needs npm 11.5.1+.
        run: |
          source scripts/toolchain.sh
          npm install --global npm@11.6.2
          for dir in $(< "$RUNNER_TEMP/publish.txt"); do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            pack="$RUNNER_TEMP/pack/$dir"
            mkdir -p "$pack"
            pnpm --filter "$name" pack --pack-destination "$pack"
            npm publish "$pack"/*.tgz --access public --provenance
          done
